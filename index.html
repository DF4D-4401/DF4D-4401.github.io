<!DOCTYPE html>  
<html lang="en">  

<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>神秘站点 QWQ</title>  

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>  

    <style>  
        /* CSS 样式 */  
        body {  
            font-family: Arial, sans-serif;  
            padding: 20px;  
            background: #f7f7f7;  
        }  

        .container {  
            display: flex;  
            flex-wrap: wrap;  
            gap: 20px;  
            justify-content: center;  
        }  

        .box {  
            padding: 20px;  
            border: 1px solid #ccc;  
            border-radius: 5px;  
            background-color: #fff;  
            cursor: pointer;  
            width: 200px;  
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);  
        }  

        .modal {  
            display: none;  
            position: fixed;  
            top: 0;  
            left: 0;  
            width: 100%;  
            height: 100%;  
            background-color: rgba(0, 0, 0, 0.7);  
            justify-content: center;  
            align-items: center;  
        }  

        .modal-content {  
            background: #fff;  
            padding: 20px;  
            border-radius: 10px;  
            width: 80%;  
            max-width: 600px;  
        }  

        .close {  
            cursor: pointer;  
        }  

        a {  
            color: blue;  
        }  

    </style>  
</head>  

<body>  
    <h1>神秘站点 QWQ</h1>  
    <div class="container" id="container"></div>  

    <div id="myModal" class="modal">  
        <div class="modal-content">  
            <span class="close" onclick="closeModal()">&times;</span>  
            <div id="modalText"></div>  
        </div>  
    </div>  

    <script>  
        function loadData() {  
            fetch('data.json')  
                .then(response => response.json())  
                .then(data => {  
                    const container = document.getElementById('container');  
                    data.forEach(item => {  
                        const box = document.createElement('div');  
                        box.className = 'box';  
                        box.onclick = () => openModal(item.content, item.link);  
                        box.innerHTML = `<h3>${item.title}</h3><p>点击以展开</p>`;  
                        container.appendChild(box);  
                    });  
                })  
                .catch(error => {  
                    console.error('Error loading JSON:', error);  
                    alert('加载数据失败，请检查控制台。');  
                });  
        }  

        function openModal(content, link) {  
            try {  
                console.log(marked); // 确保这里能够正确输出函数  
                const htmlContent = marked(content);  
                document.getElementById("modalText").innerHTML = `  
                    ${htmlContent}<br><a href="${link}" target="_blank">点击这里访问链接</a>  
                `;  
                document.getElementById("myModal").style.display = "flex";  
            } catch (error) {  
                console.error('Error processing Markdown:', error);  
                alert('处理Markdown内容失败，请检查控制台。');  
            }  
        }  

        function closeModal() {  
            document.getElementById("myModal").style.display = "none";  
        }  

        window.onclick = function(event) {  
            const modal = document.getElementById("myModal");  
            if (event.target === modal) {  
                closeModal();  
            }  
        }  

        document.addEventListener('DOMContentLoaded', loadData);  
    </script>  
</body>  

</html>
