<!DOCTYPE html>  
<html lang="en">  

<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>神秘站点 QWQ</title>  

    <!-- 引入 marked.js -->  
<script src="df4d-4401.github.io/marked.min.js/marked.min.js"></script>  

    <style>  
        /* 重置样式 */  
        * {  
            box-sizing: border-box;  
            margin: 0;  
            padding: 0;  
        }  

        body {  
            font-family: 'Arial', sans-serif;  
            background: linear-gradient(135deg, #e0f7fa, #ffebee);  
            padding: 20px;  
            color: #333;  
            line-height: 1.6;  
        }  

        h1 {  
            text-align: center;  
            margin-bottom: 1rem;  
            color: #005b5c;  
        }  

        .container {  
            display: flex;  
            flex-wrap: wrap;  
            gap: 20px;  
            justify-content: center;  
            padding: 20px;  
            border-radius: 15px;  
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);  
            background-color: rgba(255, 255, 255, 0.9);  
        }  

        .box {  
            flex: 1 1 calc(25% - 40px);  
            background-color: #ffffff;  
            border-radius: 10px;  
            padding: 20px;  
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);  
            cursor: pointer;  
            transition: transform 0.3s ease, box-shadow 0.3s ease;  
            text-align: center;  
            position: relative;  
            overflow: hidden;  
        }  

        .box:hover {  
            transform: translateY(-5px);  
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);  
        }  

        .modal {  
            display: none;  
            position: fixed;  
            z-index: 1000;  
            left: 0;  
            top: 0;  
            width: 100%;  
            height: 100%;  
            overflow: auto;  
            background-color: rgba(0, 0, 0, 0.7);  
            padding-top: 60px;  
        }  

        .modal-content {  
            background-color: #fefefe;  
            margin: 5% auto;  
            padding: 20px;  
            border: 1px solid #888;  
            width: 80%;  
            max-width: 600px;  
            border-radius: 10px;  
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);  
            animation: fadeIn 0.5s;  
            position: relative;  
        }  

        .close {  
            color: #aaa;  
            float: right;  
            font-size: 28px;  
            font-weight: bold;  
        }  

        .close:hover,  
        .close:focus {  
            color: black;  
            text-decoration: none;  
            cursor: pointer;  
        }  

        @keyframes fadeIn {  
            from {  
                opacity: 0;  
            }  

            to {  
                opacity: 1;  
            }  
        }  

        a {  
            color: #007bff;  
            text-decoration: none;  
            transition: color 0.3s;  
        }  

        a:hover {  
            color: #0056b3;  
            text-decoration: underline;  
        }  

        @media (max-width: 768px) {  
            .box {  
                flex: 1 1 100%;  
            }  
        }  
    </style>  
</head>  

<body>  
    <h1>神秘站点 QWQ</h1>  
    <div class="container" id="container"></div>  

    <div id="myModal" class="modal">  
        <div class="modal-content">  
            <span class="close" onclick="closeModal()">&times;</span>  
            <div id="modalText"></div>  
        </div>  
    </div>  

    <script>  
        // 确保在DOM加载完成后执行  
        document.addEventListener('DOMContentLoaded', function() {  
            // 测试 marked 是否可用  
            if (typeof marked !== 'function') {  
                alert('错误：marked.js 未正确加载!');  
                return;  
            }  

            // 加载 JSON 数据  
            function loadData() {  
                fetch('data.json')  
                    .then(response => response.json())  
                    .then(data => {  
                        const container = document.getElementById('container');  
                        data.forEach(item => {  
                            const box = document.createElement('div');  
                            box.className = 'box';  
                            box.onclick = () => openModal(item.content, item.link); // 传递内容和链接  
                            box.innerHTML = `<h3>${item.title}</h3><p>点击以展开</p>`;  
                            container.appendChild(box);  
                        });  
                    })  
                    .catch(error => {  
                        console.error('Error loading JSON:', error);  
                        alert('加载数据失败，请检查控制台。');  
                    });  
            }  

            // 打开模态窗口并显示内容  
            function openModal(content, link) {  
                try {  
                    // 使用 marked.parse 代替直接调用 marked  
                    const htmlContent = marked.parse(content);  
                    document.getElementById("modalText").innerHTML = `  
                        ${htmlContent}<br>  
                        <a href="${link}" target="_blank" rel="noopener noreferrer">点击这里访问链接</a>  
                    `;  
                    document.getElementById("myModal").style.display = "flex"; // 使用 flex 显示模态窗口  
                } catch (error) {  
                    console.error('Error processing Markdown:', error);  
                    alert('处理Markdown内容失败，请检查控制台。');  
                }  
            }  

            // 关闭模态窗口  
            function closeModal() {  
                document.getElementById("myModal").style.display = "none";  
            }  

            // 点击模态窗口外部区域关闭  
            window.onclick = function(event) {  
                const modal = document.getElementById("myModal");  
                if (event.target === modal) {  
                    closeModal();  
                }  
            };  

            // 初始加载数据  
            loadData();  
        });  
    </script>  
</body>  

</html>
